[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openhop-stormhop"
version = "0.2.0"
description = "OpenHop plugin: NWS alert relay and wx bot for mesh channels"
requires-python = ">=3.11"
license = "0BSD"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
stormhop = "stormhop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stormhop = ["zipdata.json"]

[tool.setuptools.data-files]
"share/openhop/plugins/stormhop" = ["openhop-plugin.json", "config.default.json"]
"share/openhop/plugins/stormhop/ui" = ["ui/index.html", "ui/app.js", "ui/data.js", "ui/logo.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
