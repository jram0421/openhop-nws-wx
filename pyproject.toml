[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openhop-nws-wx"
version = "0.1.13"
description = "OpenHop plugin: NWS alert relay and wx bot for mesh channels"
requires-python = ">=3.11"
license = "0BSD"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nws-wx = "nws_wx.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nws_wx = ["zipdata.json"]

[tool.setuptools.data-files]
"share/openhop/plugins/nws-wx" = ["openhop-plugin.json", "config.default.json"]
"share/openhop/plugins/nws-wx/ui" = ["ui/index.html", "ui/app.js", "ui/data.js", "ui/logo.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
